<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="matrixCanvas"></canvas>
    <div id="textContainer">3</div>
    
    <div id="mainCard">
        <div id="starsContainer"></div>

        <div id="surpriseContent">
            <img src="gambar/birthday-cake.webp" alt="Happy Birthday" class="bday-gif">
            
            <div class="envelope-wrapper" onclick="openEnvelope()">
                <div class="envelope" id="myEnvelope">
                    <div class="flap"></div>
                    <div class="pocket"></div>
                    <div class="heart-sticker">❤️</div>
                    
                    <div class="letter" id="letter">
                        <h3 style="margin-bottom: 5px; font-size: 1.2rem;">Happy Birthday!</h3>
                        
                        <div class="album-container" id="flipbook">
                            <div class="album-page" id="page3" style="z-index: 1;">
                                <img src="gambar/gambar3.jpg" alt="Kenangan 3">
                            </div>
                            
                            <div class="album-page" id="page2" style="z-index: 2;">
                                <img src="gambar/gambar2.jpg" alt="Kenangan 2">
                            </div>
                            
                            <div class="album-page" id="page1" style="z-index: 3;">
                                <img src="gambar/gambar1.jpg" alt="Kenangan 1">
                                <div class="swipe-hint">👈 Swipe to flip</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <p class="hint">Tap the heart to open</p>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
